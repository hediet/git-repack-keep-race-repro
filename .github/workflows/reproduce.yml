name: Demonstrate object loss and workaround

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  released:
    name: ${{ matrix.os }} / released Git
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Git for Windows 2.55.0.windows.3
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'PortableGit.7z.exe'
          $destination = Join-Path $env:RUNNER_TEMP 'repro-git'
          Invoke-WebRequest 'https://github.com/git-for-windows/git/releases/download/v2.55.0.windows.3/PortableGit-2.55.0.3-64-bit.7z.exe' -OutFile $archive
          $expected = 'ab00566336b5472120f9a52d34f2e79c5406535792acb0548001ffd0bd090e5d'
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            throw 'Portable Git checksum mismatch'
          }
          7z x $archive "-o$destination" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Portable Git extraction failed' }
          "$destination\cmd" >> $env:GITHUB_PATH

      - name: Build upstream Git 2.55.0
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 --branch=v2.55.0 https://github.com/git/git.git "$RUNNER_TEMP/git-source"
          make -C "$RUNNER_TEMP/git-source" -j"$(nproc)" \
            prefix="$RUNNER_TEMP/repro-git" \
            NO_GETTEXT=YesPlease NO_TCLTK=YesPlease NO_PERL=YesPlease \
            NO_CURL=YesPlease NO_EXPAT=YesPlease \
            all install >"$RUNNER_TEMP/git-build.log" 2>&1 || {
              cat "$RUNNER_TEMP/git-build.log"
              exit 1
            }
          echo "$RUNNER_TEMP/repro-git/bin" >> "$GITHUB_PATH"

      - name: Verify pinned version and reproduce three times
        shell: pwsh
        run: |
          $version = git --version
          $expected = if ($IsWindows) { 'git version 2.55.0.windows.3' } else { 'git version 2.55.0' }
          if ($version -ne $expected) { throw "Unexpected Git version: $version" }
          python repro.py --repeat 3 --expect vulnerable
          if ($LASTEXITCODE -ne 0) { throw 'Reproduction expectations failed' }

      - name: Upload evidence (no repository pack data)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ matrix.os }}
          if-no-files-found: warn
          path: |
            artifacts/results.json
            artifacts/summary.md
            artifacts/**/*.log

  candidate-fix:
    name: gitgitgadget/git#2219 (unpatched master vs patched)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch unpatched master and the proposed fix
        shell: bash
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/git-source"
          cd "$RUNNER_TEMP/git-source"
          git remote add origin https://github.com/gitgitgadget/git.git
          git fetch -q --depth=1 origin refs/heads/master:refs/heads/unpatched
          git fetch -q --depth=1 origin refs/pull/2219/head:refs/heads/patched
          {
            echo "Unpatched master: $(git rev-parse unpatched)"
            echo "pull/2219/head:   $(git rev-parse patched)"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build both trees
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/git-source"
          for tree in unpatched patched; do
            git checkout -q --detach "$tree"
            make -j"$(nproc)" prefix="$RUNNER_TEMP/$tree" \
              NO_GETTEXT=YesPlease NO_TCLTK=YesPlease NO_PERL=YesPlease \
              NO_CURL=YesPlease NO_EXPAT=YesPlease \
              all install >"$RUNNER_TEMP/build-$tree.log" 2>&1 || {
                tail -50 "$RUNNER_TEMP/build-$tree.log"
                exit 1
              }
            make clean >/dev/null 2>&1
          done

      - name: Unpatched master must still lose objects
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/unpatched/bin/git" --version
          python repro.py --git "$RUNNER_TEMP/unpatched/bin/git" \
            --output artifacts/unpatched --repeat 3 --expect vulnerable

      - name: The proposed fix must preserve every object
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/patched/bin/git" --version
          python repro.py --git "$RUNNER_TEMP/patched/bin/git" \
            --output artifacts/patched --repeat 3 --expect fixed

      - name: Upload evidence (no repository pack data)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-candidate-fix
          if-no-files-found: warn
          path: |
            artifacts/**/results.json
            artifacts/**/summary.md
            artifacts/**/*.log
